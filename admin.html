<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ActivityEvent 內容管理</title>
<style>
  :root {
    --bg:#f4f6fa; --panel:#ffffff; --line:#e2e8f0; --ink:#1e293b; --muted:#64748b;
    --accent:#2563eb; --accent-ink:#ffffff; --danger:#dc2626;
    --klook:#7c3aed; --trip:#0d9488; --map:#64748b; --owlting:#ea580c;
    --souvenir:#db2777; --dining:#ca8a04;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
         background:var(--bg); color:var(--ink); font-size:14px; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:700; }
  header .grow { flex:1; }
  select, button { font-size:13px; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:#fff; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); cursor:pointer; font-weight:600; }
  button.primary:disabled { opacity:.5; cursor:not-allowed; }
  #status { font-size:12px; color:var(--muted); }
  #status.dirty { color:#b45309; }
  #status.ok { color:#15803d; }
  #status.err { color:var(--danger); }

  .layout { display:flex; min-height:calc(100vh - 53px); }
  aside { width:230px; background:var(--panel); border-right:1px solid var(--line); padding:10px; overflow-y:auto; }
  aside .lang-tabs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; }
  aside .lang-tabs button { font-size:11px; padding:3px 7px; border-radius:6px; }
  aside .lang-tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .topic-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; cursor:pointer; margin-bottom:2px; }
  .topic-item:hover { background:#eef2ff; }
  .topic-item.on { background:#dbeafe; font-weight:600; }
  .topic-item .ic { font-size:18px; }
  .topic-item .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topic-item .cnt { font-size:11px; color:var(--muted); }

  main { flex:1; padding:16px; overflow-y:auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .field-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .field-grid .full { grid-column:1 / -1; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  input, textarea { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; font-size:13px;
                    font-family:inherit; background:#fbfcfe; }
  input:focus, textarea:focus { outline:2px solid #bfdbfe; border-color:var(--accent); }
  textarea { resize:vertical; min-height:46px; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; color:#fff; font-weight:600; }
  .b-klook{background:var(--klook)} .b-trip{background:var(--trip)} .b-map{background:var(--map)}
  .b-owlting{background:var(--owlting)} .b-souvenir{background:var(--souvenir)} .b-dining{background:var(--dining)}
  .b-none{background:#94a3b8}
  .item-row { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .item-head { display:flex; align-items:center; gap:10px; }
  .item-head .rank { font-weight:700; color:var(--muted); min-width:22px; }
  .item-head .nm { flex:1; }
  .item-head .link { font-size:12px; }
  .item-body { margin-top:8px; }
  .mono, .link-a { font-size:12px; color:var(--accent); word-break:break-all; text-decoration:none; }
  .link-a:hover { text-decoration:underline; }
  .hint { font-size:12px; color:var(--muted); }
  .links-editor { margin-top:8px; border-top:1px dashed var(--line); padding-top:8px; }
  .link-row { display:grid; grid-template-columns:90px 130px 1fr 28px; gap:6px; margin-bottom:6px; align-items:center; }
  .link-row input { padding:5px 7px; font-size:12px; }
  .link-del { border:none; background:transparent; color:var(--danger); cursor:pointer; font-size:14px; padding:2px; }
  .add-link { border:1px dashed var(--accent); color:var(--accent); background:#fff; border-radius:8px; padding:4px 10px; cursor:pointer; font-size:12px; }
  .toolbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .toolbar h2 { margin:0; }
  .toolbar-actions { display:flex; align-items:center; gap:8px; margin-left:auto; }
  .jump-btn { display:inline-flex; align-items:center; gap:4px; padding:5px 10px; border-radius:8px; border:1px solid #93c5fd; background:#eff6ff; color:#1d4ed8; font-weight:600; font-size:12px; cursor:pointer; text-decoration:none; }
  .jump-btn:hover { background:#dbeafe; border-color:#60a5fa; }
  .jump-btn.secondary { background:#f8fafc; border-color:#cbd5e1; color:#475569; }
  .jump-btn.secondary:hover { background:#f1f5f9; border-color:#94a3b8; }
  .section-card { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:#fbfcfe; }
  .section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-weight:600; font-size:13px; }
  .search { margin-left:auto; }
  .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none;
                   align-items:center; justify-content:center; z-index:100; padding:16px; }
  .modal-overlay.open { display:flex; }
  .modal { background:#fff; border-radius:14px; padding:18px 20px; width:min(680px, 94vw);
           max-height:88vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .modal h2 { margin:0 0 12px; font-size:16px; }
  .modal .field-grid { grid-template-columns:repeat(2, 1fr); }
  .modal .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .menu-editor-toolbar { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .menu-editor-toolbar button { border:1px solid var(--line); background:#fff; padding:7px 12px; border-radius:6px; cursor:pointer; }
  .menu-visual-editor { min-height:160px; max-height:600px; overflow:auto; border:1px solid var(--line); padding:16px; border-radius:8px; background:#fffdf9; overflow-wrap:anywhere; }
  .menu-visual-editor:focus { outline:2px solid #bfdbfe; }
  .menu-visual-editor table { width:100%; border-collapse:collapse; table-layout:fixed; }
  .menu-visual-editor th, .menu-visual-editor td { padding:12px 6px; border-bottom:1px dotted #d8d0c5; vertical-align:top; text-align:left; }
  .menu-visual-editor tr > :last-child:not(:first-child) { width:30%; text-align:right; color:#b85233; }
  .menu-visual-editor small { display:block; color:var(--muted); }
  .menu-source-details { margin:14px 0; }
  .menu-source { min-height:160px; font-family:monospace; }
  .menu-editor-preview { width:100%; min-height:300px; border:1px solid var(--line); margin-top:10px; background:#faf8f5; }
  .cafe-menu-editor h3 { font-size:13px; margin:14px 0 0; }
  .report-body-editor { min-height:130px; max-height:620px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:16px; background:#fff; line-height:1.8; overflow-wrap:anywhere; }
  .report-body-editor:focus { outline:2px solid #bfdbfe; }
  .report-body-editor table { border-collapse:collapse; width:100%; min-width:580px; }
  .report-body-editor th, .report-body-editor td { border:1px solid var(--line); padding:10px; text-align:left; }
  .report-body-editor ul, .report-body-editor ol { padding-left:24px; }
  .report-editor-error, [aria-invalid="true"] { color:var(--danger); border-color:var(--danger); }
  #main { min-width:0; }
  .section-card > summary { cursor:pointer; font-weight:600; padding:8px 0; }
</style>
</head>
<body>
<header>
  <h1>🏷️ ActivityEvent 內容管理</h1>
  <select id="fileSelect" title="選擇檔案"></select>
  <button id="reloadBtn">重新載入</button>
  <button id="saveBtn" class="primary" disabled>💾 存檔</button>
  <span id="status">就緒</span>
</header>

<div class="layout">
  <aside>
    <div class="lang-tabs" id="langTabs"></div>
    <div id="topicList"></div>
  </aside>
  <main id="main"></main>
</div>

<div class="modal-overlay" id="spotModal" onclick="if(event.target===this)closeSpotModal()">
  <div class="modal">
    <h2 id="spotModalTitle">新增景點</h2>
    <div class="field-grid" id="spotModalForm"></div>
    <div class="modal-actions">
      <button type="button" onclick="closeSpotModal()">取消</button>
      <button type="button" class="primary" onclick="saveNewSpot()">＋ 新增景點</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cafeModal" onclick="if(event.target===this)closeCafeModal()">
  <form class="modal" onsubmit="event.preventDefault();saveNewCafe()">
    <h2>新增咖啡店</h2>
    <div class="field-grid" id="cafeModalForm"></div>
    <p class="hint">新增後請按「存檔」。新店家會同步至其他語言，文字先沿用本次輸入的內容。</p>
    <div class="modal-actions">
      <button type="button" onclick="closeCafeModal()">取消</button>
      <button type="submit" class="primary">＋ 新增咖啡店</button>
    </div>
  </form>
</div>

<div class="modal-overlay" id="cafeArticleModal" onclick="if(event.target===this)closeCafeArticleModal()">
  <form class="modal" onsubmit="event.preventDefault();saveNewCafeArticle()">
    <h2>新增咖啡深度文章</h2>
    <div class="field-grid" id="cafeArticleModalForm"></div>
    <p class="hint">新增後請按「存檔」。文章結構會同步至其他語言。</p>
    <div class="modal-actions">
      <button type="button" onclick="closeCafeArticleModal()">取消</button>
      <button type="submit" class="primary">＋ 新增文章</button>
    </div>
  </form>
</div>

<script src="/cafe-menu-html.js"></script>
<script src="/cafe-menu-editor.js"></script>
<script src="/editorial-report-editor.js"></script>
<script>
const state = { path:null, data:null, selectedTopic:null, selectedArticle:null, selectedCafe:null, selectedCafeArticle:null, selectedCharter:null, selectedMichelin:null, selectedTheme:null, selectedSouvenir:null, selectedHomeBlog:null, selectedHomeRanking:null, selectedThemeGrid:null, selectedActivity:null, selectedSpot:null, dirty:false, files:{}, targetCafeId:null, targetArticleCafeId:null, cafeArticlesMap:null };
const $ = s => document.querySelector(s);

function channelBadge(type){
  const t = (type||'').toLowerCase();
  const cls = {klook:'b-klook', trip:'b-trip', map:'b-map', owlting:'b-owlting', souvenir:'b-souvenir', dining:'b-dining'}[t] || 'b-none';
  return `<span class="badge ${cls}">${type||'—'}</span>`;
}

async function api(url, opts){
  const r = await fetch(url, opts);
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}

async function loadFiles(){
  state.files = await api('/api/files');
  const sel = $('#fileSelect');
  const langs = Object.keys(state.files).sort();
  sel.innerHTML = '';
  const add = (label, value) => {
    const o = document.createElement('option');
    o.value = value; o.textContent = label; sel.appendChild(o);
  };
  for(const dir of langs){
    for(const f of state.files[dir]){
      const rel = (dir === '.' ? f : dir + '/' + f);
      add(rel, rel);
    }
  }
  // 預設選 zh/rankings.json
  const preferred = new URLSearchParams(location.search).get('file') || 'content/zh/rankings.json';
  if([...sel.options].some(o => o.value === preferred)) sel.value = preferred;
  renderLangTabs();
  await loadFile(sel.value);
}

function renderLangTabs(){
  const wrap = $('#langTabs');
  wrap.innerHTML = '';
  const langs = Object.keys(state.files).filter(d => d.startsWith('content/')).sort();
  for(const dir of langs){
    const lang = dir.split('/')[1];
    const b = document.createElement('button');
    b.textContent = lang;
    b.onclick = () => switchLang(lang);
    const cur = state.path ? state.path.split('/')[1] : null;
    if(lang === cur) b.classList.add('on');
    wrap.appendChild(b);
  }
}

function switchLang(lang){
  const fname = state.path ? state.path.split('/').pop() : 'rankings.json';
  const rel = `content/${lang}/${fname}`;
  if(state.files[`content/${lang}`] && state.files[`content/${lang}`].includes(fname)){
    $('#fileSelect').value = rel;
    loadFile(rel);
  }
}

async function loadFile(path, options = {}){
  const articleFile=value=>/\/(editorial_reports|michelin_articles)\.json$/.test(value||'');
  if(state.dirty && articleFile(state.path) && !confirm('目前報導有未儲存的變更，確定捨棄並載入？')){
    $('#fileSelect').value = state.path; return;
  }
  const reportId = articleFile(state.path) ? state.data[state.selectedReport || 0]?.id : null;
  const requestedRestaurantId=options.targetRestaurantId || (state.path?.endsWith('/michelin_articles.json') ? state.data[state.selectedReport ?? 0]?.restaurantId || state.requestedRestaurantId : null);
  const res = await api('/api/file?path=' + encodeURIComponent(path));
  state.path = res.path;
  state.data = res.data;
  state.dirty = false;
  state.selectedTopic = null;
  state.selectedArticle = null;
  state.selectedReport = 0;
  state.selectedCafe = null;
  state.selectedCafeArticle = null;
  state.selectedCharter = null;
  state.selectedMichelin = null;
  state.selectedTheme = null;
  state.selectedSouvenir = null;
  state.selectedHomeBlog = null;
  state.selectedHomeRanking = null;
  state.selectedThemeGrid = null;
  state.selectedActivity = null;
  state.selectedSpot = null;

  if(options.targetCafeId !== undefined){ state.targetCafeId = options.targetCafeId; }
  if(options.targetArticleCafeId !== undefined){ state.targetArticleCafeId = options.targetArticleCafeId; }

  // 如果載入的是 cafes.json，同步預載同語系的 cafe_articles.json 建立索引
  const fname = state.path ? state.path.split('/').pop() : '';
  if(articleFile(state.path) && reportId) state.selectedReport = Math.max(0,state.data.findIndex(report=>report.id===reportId));
  if(fname === 'michelin_articles.json'){
    state.requestedRestaurantId=requestedRestaurantId;
    const language=state.path.split('/')[1];let directory;
    try{directory=await api('/api/file?path='+encodeURIComponent(`content/${language}/michelin.json`));}
    catch(e){directory=await api('/api/file?path=content/en/michelin.json');}
    state.michelinRestaurants=[...(directory.data.stars||[]),...(directory.data.bib||[])];
    if(requestedRestaurantId)state.selectedReport=state.data.findIndex(a=>a.restaurantId===requestedRestaurantId);
    if(options.targetRestaurantId){
      let index=state.data.findIndex(a=>a.restaurantId===options.targetRestaurantId);
      if(index<0){const restaurant=state.michelinRestaurants.find(r=>r.id===options.targetRestaurantId);if(restaurant){const id='michelin_'+Date.now().toString(36);state.data.push({id,slug:id,restaurantId:restaurant.id,language,title:restaurant.name,summary:'',status:'draft',published:false,isSample:false,reviewStatus:'needs-fact-check',sections:[],menuVariants:[],honors:{years:[]}});index=state.data.length-1;state.dirty=true;}}
      state.selectedReport=Math.max(0,index);
    }
  }
  if(fname === 'affiliate_config.json'){
    $('#topicList').innerHTML = '<p class="hint">官網與 App 共用分潤設定</p>';
    main.innerHTML = '<div class="card"><h2>全球分潤設定</h2><p class="hint">修改追蹤參數後，請執行 python3 migrate_affiliate_links.py --apply，更新既有內容與 links.json。App 會在下次啟動時讀取已發布的設定。</p><div class="field-grid">'
      + Object.entries(state.data).map(([key, value]) => genField('', key, value)).join('') + '</div></div>';
    bindEdits();
    return;
  }
  const lang = (state.path && state.path.startsWith('content/')) ? state.path.split('/')[1] : null;
  if(fname === 'cafes.json' && lang){
    try {
      const artRes = await api('/api/file?path=' + encodeURIComponent(`content/${lang}/cafe_articles.json`));
      state.cafeArticlesMap = {};
      if(Array.isArray(artRes.data)){
        artRes.data.forEach((art, idx) => {
          if(art.cafeId) state.cafeArticlesMap[art.cafeId] = { article: art, index: idx };
        });
      }
    } catch(e){
      state.cafeArticlesMap = null;
    }
  } else {
    state.cafeArticlesMap = null;
  }

  updateStatus();
  renderLangTabs();
  render();
}

function render(){
  const main = $('#main');
  if(!state.data) { main.innerHTML = '<div class="card">載入中…</div>'; return; }
  const fname = state.path ? state.path.split('/').pop() : '';
  if(fname === 'home_blog.json'){ renderHomeBlogList(); renderHomeBlog(); return; }
  if(['editorial_reports.json','michelin_articles.json'].includes(fname) && Array.isArray(state.data)){
    EditorialReportEditor.mount({root:main,list:$('#topicList'),reports:state.data,
      selected:state.selectedReport ?? 0,language:state.path.split('/')[1],kind:fname==='michelin_articles.json'?'michelin':'reports',restaurants:state.michelinRestaurants||[],requestedRestaurantId:state.requestedRestaurantId,
      select:index=>{try{EditorialReportEditor.validate();}catch(e){alert(e.message);return;}state.selectedReport=index;if(fname==='michelin_articles.json')state.requestedRestaurantId=state.data[index]?.restaurantId||state.requestedRestaurantId;render();},changed:markDirty});
    return;
  }
  if(fname === 'home_rankings.json'){ renderHomeRankingsList(); renderHomeRankings(); return; }
  if(fname === 'theme_grid.json'){ renderThemeGridList(); renderThemeGrid(); return; }
  if(fname === 'activities.json'){ renderActivitiesList(); renderActivities(); return; }
  if(fname === 'spots.json'){ renderSpotsList(); renderSpots(); return; }
  if(fname === 'cafes.json' && Array.isArray(state.data)){ renderCafe(); renderCafeList(); return; }
  if(fname === 'cafe_articles.json' && Array.isArray(state.data)){ renderCafeArticles(); renderCafeArticleList(); return; }
  if(state.data && state.data.topics && state.data.items){
    renderRankings();
    renderTopics();
  } else if(state.data && Array.isArray(state.data.stars) && Array.isArray(state.data.bib)){
    renderMichelin();
    renderMichelinList();
  } else if(Array.isArray(state.data) && state.data.length && (state.data[0].spotInfo !== undefined || state.data[0].fullHtmlArticle !== undefined)){
    renderBlog();
    renderBlogList();
  } else if(Array.isArray(state.data) && state.data.length && state.data[0].mapUrl !== undefined){
    renderCafe();
    renderCafeList();
  } else if(Array.isArray(state.data) && state.data.length && state.data[0].commissionRate !== undefined){
    renderCharter();
    renderCharterList();
  } else if(Array.isArray(state.data) && state.data.length && state.data[0].bookingCta !== undefined){
    renderThemes();
    renderThemesList();
  } else if(Array.isArray(state.data) && state.data.length && state.data[0].defaultUrl !== undefined && state.data[0].items !== undefined){
    renderSouvenirs();
    renderSouvenirsList();
  } else {
    main.innerHTML = `<div class="card"><h2>${state.path}</h2><pre>${escapeHtml(JSON.stringify(state.data,null,2))}</pre></div>`;
    $('#topicList').innerHTML = '';
  }
}

function renderTopics(){
  const list = $('#topicList');
  list.innerHTML = '';
  if(!(state.data && state.data.topics)) return;
  state.data.topics.forEach((t,i)=>{
    const items = state.data.items[t.id] || [];
    const div = document.createElement('div');
    div.className = 'topic-item' + (state.selectedTopic === i ? ' on' : '');
    div.innerHTML = `<span class="ic">${t.icon||''}</span><span class="nm">${escapeHtml(t.zhName||t.id)}</span><span class="cnt">${items.length}</span>`;
    div.onclick = ()=>{ state.selectedTopic = i; render(); };
    list.appendChild(div);
  });
}

function renderBlogList(){
  const list = $('#topicList');
  list.innerHTML = '';
  if(!Array.isArray(state.data)) return;
  state.data.forEach((a,i)=>{
    const div = document.createElement('div');
    div.className = 'topic-item' + (state.selectedArticle === i ? ' on' : '');
    div.innerHTML = `<span class="ic">📄</span><span class="nm">${escapeHtml(a.title||a.id)}</span>`;
    div.onclick = ()=>{ state.selectedArticle = i; render(); };
    list.appendChild(div);
  });
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderBlog(){
  const main = $('#main');
  if(state.selectedArticle == null){ state.selectedArticle = 0; }
  const a = state.data[state.selectedArticle];
  if(!a){ main.innerHTML = '<div class="card">無資料</div>'; return; }
  const sp = a.spotInfo || {};
  const p = `[${state.selectedArticle}]`;
  const spPath = `${p}.spotInfo`;

  let html = `<div class="toolbar"><h2>文章 ${state.selectedArticle+1} / ${state.data.length}</h2>
    <input class="search" id="itemSearch" placeholder="🔍 搜尋內文…" style="display:none"></div>`;

  html += `<div class="card"><h2>📄 文章資訊</h2><div class="field-grid">
    ${tfp(p,'id', a.id)} ${tfp(p,'category', a.category)}
    ${tap(p,'title', a.title)} ${tap(p,'subtitle', a.subtitle)}
    ${tfp(p,'author', a.author)} ${tfp(p,'readTime', a.readTime)}
    ${tfp(p,'date', a.date)} ${tfp(p,'vol', a.vol)}
    ${tfp(p,'city', a.city)} ${tfp(p,'district', a.district)}
    ${tfp(p,'slug', a.slug)} ${tfp(p,'rating', a.rating)}
    ${tfp(p,'readCount', a.readCount)} ${tfp(p,'heroImg', a.heroImg)}
    ${tap(p,'authorQuote', a.authorQuote)}
  </div></div>`;

  html += `<div class="card"><h2>📍 景點資訊 spotInfo</h2><div class="field-grid">
    ${tap(spPath,'name', sp.name)} ${tap(spPath,'address', sp.address)}

function saveNewCafe(){
  const val = key => $('#nc_' + key).value.trim();
  if(!val('name') || !val('city')){ alert('請填寫店名與縣市'); return; }
  const cafe = {id:'cafe_' + crypto.randomUUID()};
  for(const key of ['name','city','city_en','district','address','phone','status','price','rate','features','mapUrl','img']) cafe[key] = val(key);
  for(const key of ['tags','tagEmojis']) cafe[key] = val(key).split(',').map(s=>s.trim()).filter(Boolean);
  cafe.links = [];
  state.data.push(cafe);
  state.selectedCafe = state.data.length - 1;
  closeCafeModal();
  markDirty();
  render();
}

function removeCafe(){
  const cafe = state.data[state.selectedCafe];
  if(!cafe || !confirm(`確定刪除「${cafe.name}」？存檔後會從所有語言同步移除。`)) return;
  state.data.splice(state.selectedCafe, 1);
  state.selectedCafe = state.data.length ? Math.min(state.selectedCafe, state.data.length - 1) : null;
  markDirty();
  render();
}

function saveNewSpot(){
  const th = state.data[state.selectedTheme];
  const val = id => { const el = $('#'+id); return el ? el.value.trim() : ''; };
  const spot = {
    name: val('ns_name'),
    subCategory: val('ns_subCategory'),
    subName: val('ns_subName'),
    en: val('ns_en'),
    tag: val('ns_tag'),
    desc: val('ns_desc'),
    img: val('ns_img'),
  };
  const urls = { hotelUrl:'ns_hotelUrl', charterUrl:'ns_charterUrl', trainTicketUrl:'ns_trainTicketUrl', permitUrl:'ns_permitUrl', campUrl:'ns_campUrl' };
  for(const k in urls){ const v = val(urls[k]); if(v) spot[k] = v; }
  const singles = ['rate','altitude','address','route','movieTitle','day1Plan','day2Plan'];
  singles.forEach(k=>{ const v = val('ns_'+k); if(v) spot[k] = v; });
  const rank = val('ns_rank');
  if(rank !== '') spot.rank = Number(rank);
  const tags = val('ns_tags');
  if(tags) spot.tags = tags.split(',').map(t=>t.trim()).filter(Boolean);
  if(!spot.name){ alert('請填寫景點名稱'); return; }
  if(!Array.isArray(th.spots)) th.spots = [];
  th.spots.push(spot);
  closeSpotModal();
  markDirty();
  render();
}

// =========================================================
// 通用欄位渲染器：依值型別自動輸出對應編輯元件
// 支援 number / boolean / 字串陣列 / 物件(遞迴) / 字串(長短自動切換)
// =========================================================
function genField(path, key, val){
  if(val === undefined || val === null){
    return `<div>${label(key)}<input data-path="${path}.${key}" value=""></div>`;
  }
  if(typeof val === 'number'){
    return `<div>${label(key)}<input data-numeric="1" data-path="${path}.${key}" value="${escapeHtml(val)}"></div>`;
  }
  if(typeof val === 'boolean'){
    return `<div>${label(key)}<select data-path="${path}.${key}" data-bool="1">
      <option value="true"${val?' selected':''}>true</option>
      <option value="false"${val?'':' selected'}>false</option>
    </select></div>`;
  }
  if(Array.isArray(val)){
    if(val.every(x => typeof x === 'string')){
      return `<div class="full">${label(key + '（陣列，逗號分隔）')}<textarea data-path="${path}.${key}" data-csv="1">${escapeHtml(val.join(', '))}</textarea></div>`;
    }
    return `<div class="full">${label(key + '（陣列，JSON）')}<textarea data-path="${path}.${key}" data-json="1">${escapeHtml(JSON.stringify(val, null, 2))}</textarea></div>`;
  }
  if(typeof val === 'object'){
    let out = `<div class="full" style="border:1px dashed var(--line);border-radius:8px;padding:8px;margin-bottom:4px">${label(key + '（物件）')}`;
    for(const k in val){ out += genField(`${path}.${key}`, k, val[k]); }
    out += `</div>`;
    return out;
  }
  const str = String(val);
  if(str.length > 90 || str.includes('\n')){
    return `<div class="full">${label(key)}<textarea data-path="${path}.${key}">${escapeHtml(str)}</textarea></div>`;
  }
  return `<div>${label(key)}<input data-path="${path}.${key}" value="${escapeHtml(str)}"></div>`;
}

// 通用清單渲染器（陣列型資料）
function genListRender(arr, selKey, icon, nameFn, cntFn){
  const list = $('#topicList');
  list.innerHTML = '';

  arr.forEach((a,i)=>{
    const div = document.createElement('div');
    div.className = 'topic-item' + (state[selKey] === i ? ' on' : '');
    div.innerHTML = `<span class="ic">${icon}</span><span class="nm">${escapeHtml(nameFn(a)||'')}</span><span class="cnt">${escapeHtml((cntFn&&cntFn(a))||'')}</span>`;
    div.onclick = ()=>{ state[selKey] = i; render(); };
    list.appendChild(div);
  });
}

      const on = state.selectedHomeRanking && state.selectedHomeRanking.cat===cat && state.selectedHomeRanking.index===i;
      const div = document.createElement('div');
      div.className = 'topic-item' + (on?' on':'');
      div.innerHTML = `<span class="ic">${a.rank?'#'+a.rank:''}</span><span class="nm">${escapeHtml(a.name||'')}</span><span class="cnt">${escapeHtml(a.city||a.rate||'')}</span>`;
      div.onclick = ()=>{ state.selectedHomeRanking = {cat, index:i}; render(); };
      list.appendChild(div);
    });
  });
}

function renderHomeRankings(){
  const main = $('#main');

    state.selectedHomeRanking = {cat: catKeys[0], index:0};
  }
  const {cat, index} = state.selectedHomeRanking || {};
  const arr = (state.data && state.data[cat]) || [];

  html += `<div class="card"><h2>項目欄位</h2><div class="field-grid">`;

  html += `</div></div>`;

  bindEdits();
}

function label(text){ return `<label>${text}</label>`; }
function tf(name, val){ return `<div>${label(name)}<input data-path="topics[${state.selectedTopic}].${name}" value="${escapeHtml(val)}"></div>`; }
function ta(name, val, full){ return `<div class="${full?'full':''}">${label(name)}<textarea data-path="topics[${state.selectedTopic}].${name}">${escapeHtml(val)}</textarea></div>`; }
function tfp(path, name, val){ return `<div>${label(name)}<input data-path="${path}.${name}" value="${escapeHtml(val)}"></div>`; }
function tap(path, name, val){ return `<div class="full">${label(name)}<textarea data-path="${path}.${name}">${escapeHtml(val)}</textarea></div>`; }

function resolvePath(obj, path){
  // path like: topics[0].ctaUrl  or  items["drinks"][2].desc
  const parts = [];
  const re = /([^\[\].]+)|\["?([^"\]]+)"?\]/g;
  let m;
  while((m = re.exec(path))){
    if(m[1] !== undefined) parts.push(m[1]);
    else parts.push(m[2]);
  }
  let cur = obj;
  for(const p of parts){
    if(cur == null) return undefined;
    cur = cur[p];
  }
  return cur;
}

function setPath(obj, path, val){
  const parts = [];
  const re = /([^\[\].]+)|\["?([^"\]]+)"?\]/g;
  let m;
  while((m = re.exec(path))){
    if(m[1] !== undefined) parts.push(m[1]);
    else parts.push(m[2]);
  }
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = val;
}

function renderLinks(basePath, links){
  const arr = links || [];
  let rows = '';
  arr.forEach((lk, li)=>{
    const p = `${basePath}[${li}]`;
    rows += `<div class="link-row">
      <input data-path="${p}.type" value="${escapeHtml(lk.type||'')}" placeholder="type" list="linkTypes" class="lt-type">
      <input data-path="${p}.label" value="${escapeHtml(lk.label||'')}" placeholder="標籤" class="lt-label">
      <input data-path="${p}.url" value="${escapeHtml(lk.url||'')}" placeholder="https://..." class="lt-url">
      <button type="button" class="link-del" onclick="removeLink('${basePath}',${li})" title="刪除">✕</button>
    </div>`;
  });
  return `<div class="links-editor">
    <label>分潤連結 links（多條，支援 klook + trip 並存）</label>
    <datalist id="linkTypes">
      <option value="klook"></option><option value="trip"></option><option value="map"></option>
      <option value="owlting"></option><option value="souvenir"></option><option value="dining"></option>
    </datalist>
    ${rows}
    <button type="button" class="add-link" onclick="addLink('${basePath}')">＋ 加連結</button>
  </div>`;
}

function addLink(basePath){
  let arr = resolvePath(state.data, basePath);
  if(!arr){ setPath(state.data, basePath, []); arr = resolvePath(state.data, basePath); }
  arr.push({type:'', label:'', url:''});
  markDirty();
  render();
}

function removeLink(basePath, li){
  const arr = resolvePath(state.data, basePath);
  if(arr) arr.splice(li, 1);
  markDirty();
  render();
}

function bindEdits(){
  document.querySelectorAll('#main [data-path]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const raw = el.value;
      let val = raw;
      if(el.dataset.csv === '1'){ val = raw.split(',').map(s=>s.trim()).filter(s=>s); }
      else if(el.dataset.percent === '1'){ val = raw === '' ? 0 : Number(raw)/100; }
      else if(el.dataset.bool === '1'){ val = raw === 'true'; }
      else if(el.dataset.numeric === '1'){ val = raw === '' ? null : Number(raw); }
      else if(el.dataset.json === '1'){ try { val = JSON.parse(raw); } catch(e){ val = raw; } }
      setPath(state.data, el.dataset.path, val);
      markDirty();
    });
  });
}

function filterItems(){
  const q = ($('#itemSearch').value||'').toLowerCase();
  document.querySelectorAll('.item-row[data-search]').forEach(row=>{
    row.style.display = (row.dataset.search||'').includes(q) ? '' : 'none';
  });
}

function markDirty(){ state.dirty = true; updateStatus(); }
function updateStatus(){
  const s = $('#status');
  $('#saveBtn').disabled = !state.dirty;
  s.className = '';
  if(state.dirty){ s.textContent = '有未儲存的變更'; s.classList.add('dirty'); }
  else { s.textContent = state.path ? '已載入：'+state.path : '就緒'; }
}

async function save(){
  if(!state.dirty) return;
  const s = $('#status');
  try{
    if(/\/(editorial_reports|michelin_articles)\.json$/.test(state.path)) EditorialReportEditor.validate();
    const res = await api('/api/file?path=' + encodeURIComponent(state.path), {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state.data)
    });
    state.dirty = false;
    updateStatus();
    const n = (res.synced && res.synced.length) || 0;
    s.textContent = res.snapshotWarning || (res.snapshotUpdated ? '已儲存，並更新本機前台 ✓' : n ? ('已儲存並同步 '+n+' 個語言 ✓') : '已儲存 ✓');
    s.className='ok';
    setTimeout(updateStatus, 2500);
  }catch(e){
    s.textContent = '儲存失敗：'+e.message; s.className='err';
  }
}

$('#fileSelect').addEventListener('change', e => loadFile(e.target.value));
$('#reloadBtn').addEventListener('click', ()=> loadFile(state.path));
$('#saveBtn').addEventListener('click', save);

loadFiles();
window.addEventListener('beforeunload', event => { if(state.dirty){event.preventDefault();event.returnValue='';} });
</script>
